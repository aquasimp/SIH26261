<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle / Shield Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Outer Wheel of Dharma (Ashoka Chakra dots) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="2 3.5" stroke-opacity="0.7" />

  <!-- Open Book of Wisdom / Wings -->
  <path d="M16 43 C22 39, 27 41, 32 44 C37 41, 42 39, 48 43" fill="none" stroke="url(#skyGrad)" stroke-width="2.6" stroke-linecap="round" />
  <path d="M16 36 C22 32, 27 34, 32 37 C37 34, 42 32, 48 36" fill="none" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" />

  <!-- Central Torch of Knowledge (Pillar) -->
  <path d="M32 20 L32 42" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Sacred Flame / Lamp (AICTE Jyoti) -->
  <path d="M32 11 C34.5 14, 36 17, 34 20 C33 21.5, 31 21.5, 30 20 C28 17, 29.5 14, 32 11 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="32" cy="18" r="1.8" fill="#FEF08A" />

  <!-- Inspection / AI Verification Pip (Top-Right Live Indicator) -->
  <circle cx="51" cy="13" r="4.5" fill="#10B981" />
  <circle cx="51" cy="13" r="2" fill="#FFFFFF" />
</svg>
